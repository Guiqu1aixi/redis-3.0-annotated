# Redis configuration file for debugging

# 基本配置
port 6379
bind 127.0.0.1

# 数据库设置
databases 16

# 持久化设置（调试时可以关闭以提高性能）
save ""
# save 900 1
# save 300 10
# save 60 10000

# 日志设置
loglevel debug
logfile ""

# 内存设置
maxmemory-policy noeviction

# 网络设置
timeout 0
tcp-keepalive 0

# 调试相关设置
daemonize no
pidfile /var/run/redis.pid

# 客户端连接设置
maxclients 10000

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 其他调试有用的设置
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-entries 512
list-max-ziplist-value 64
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64